server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Pyodide wasm 较大，开启 gzip 并做长缓存
  gzip on;
  gzip_types text/css application/javascript application/wasm application/zip application/json;

  location /pyodide/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SPA 兜底：所有路径回退到 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
